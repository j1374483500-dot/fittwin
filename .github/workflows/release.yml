name: Release alpha

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact prerelease version, for example 0.1.0-alpha.2
        required: true
        default: 0.1.0-alpha.2
      publish_npm:
        description: Publish packages after the @fittwin npm scope and NPM_TOKEN are ready
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm build
      - if: inputs.publish_npm
        run: pnpm --filter @fittwin/core publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: inputs.publish_npm
        run: pnpm --filter @fittwin/sdk publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: inputs.publish_npm
        run: pnpm --filter @fittwin/react publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: inputs.publish_npm
        run: pnpm --filter @fittwin/local-companion publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create or update GitHub pre-release
        run: |
          tag="v${{ inputs.version }}"
          if gh release view "$tag"; then
            gh release edit "$tag" --title "FitTwin $tag" --prerelease
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "FitTwin $tag" --prerelease --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
