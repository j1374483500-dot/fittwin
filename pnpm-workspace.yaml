packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  esbuild: true
# Keep vulnerable transitive resolutions on patched releases of the same major.
overrides:
  'fast-uri@>=3.0.0 <3.1.6': 3.1.6
  'brace-expansion@>=2.0.0 <2.1.4': 2.1.4
  'brace-expansion@>=5.0.0 <5.0.9': 5.0.9
  'browserslist@>=4.0.0 <4.28.7': 4.28.7
